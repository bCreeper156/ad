<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>156公告首页</title>
    <style>
        body {
            font-family: "微软雅黑", Arial, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1565c0;
            color: #fff;
            padding: 30px 0;
            text-align: center;
        }
        main {
            max-width: 800px;
            margin: 40px auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 40px 30px;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 2.5em;
        }
        .notice-list {
            list-style: none;
            padding: 0;
        }
        .notice-list li {
            border-bottom: 1px solid #e0e0e0;
            padding: 18px 0;
        }
        .notice-list li:last-child {
            border-bottom: none;
        }
        .notice-title {
            font-size: 1.2em;
            color: #1565c0;
            text-decoration: none;
        }
        .notice-date {
            color: #888;
            font-size: 0.95em;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>156公告首页</h1>
        <p>欢迎访问156公告平台，获取最新公告信息</p>
    </header>
    <main>
        <h2>最新公告</h2>
        <ul class="notice-list">
            <li>
                <a href="#" class="notice-title">null</a>
                <span class="notice-date">null</span>
            </li>
        </ul>
    </main>
</body>
</html>
