<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>156MSM 系统公告</title>
    <style>
        /* 让嵌入 iframe 的背景透明，贴合面板毛玻璃效果 */
        body {
            margin: 0;
            padding: 12px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            color: #ffffff;
            /* 已移除 text-shadow，避免字迹虚化 */
        }
        
        .panel-announcement {
            width: 100%;
            height: 100%;
        }
        
        .title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            /* 加深背景防止白字看不清 */
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 12px;
            border-radius: 8px;
        }
        
        .item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.95rem;
            /* 加深背景透明度，实现无阴影的高可读性 */
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 12px;
            border-radius: 8px;
            border-left: 3px solid rgba(76, 175, 80, 0.8);
        }
        
        .tag-new {
            background: rgba(76, 175, 80, 0.3);
            padding: 1px 10px;
            border-radius: 12px;
            margin-left: 10px;
            font-size: 0.75rem;
            border: 1px solid #a5d6a7;
            color: #a5d6a7;
        }
        
        .item-warning {
            border-left-color: #ffb300;
        }
        
        .item-warning .text-warning {
            color: #ffd54f;
        }
        
        .footer-time {
            margin-top: 12px;
            color: rgba(255,255,255,0.7);
            font-size: 0.8rem;
            text-align: right;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding-right: 12px;
            padding-bottom: 4px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="panel-announcement">
        <div class="title">
            <span>📢 156MSM 系统公告</span>
        </div>
        
        <div class="item">
            <span>✅ 面板 <b>dev0.0.1</b> 开发版本已上线运行。</span>
        </div>
        
        <div class="item">
            <span>✅ 新增 <b>实例分步创建向导</b> (支持 Paper/Purpur/Spigot 一键配置)。</span>
            <span class="tag-new">NEW</span>
        </div>
        
        <div class="item">
            <span>✅ 新增 <b>内网穿透映射管理</b> (Frp 隧道一键启停与日志查看)。</span>
            <span class="tag-new">NEW</span>
        </div>
        
        <div class="item item-warning">
            <span class="text-warning">⚠️ 安全提醒：为了面板安全，请各位管理员尽快前往 <b>【设置】</b> 页面修改默认登录密码！</span>
        </div>
        
        <div class="footer-time">
            公告更新时间：2026-08-10 12:00
        </div>
    </div>
</body>
</html>
